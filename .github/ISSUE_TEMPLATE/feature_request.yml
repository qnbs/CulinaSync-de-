name: Feature Request
description: Suggest a new feature or improvement
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your suggestion! Please describe your idea as clearly as possible.

  - type: textarea
    id: problem
    attributes:
      label: Problem description
      description: What problem does this solve? What is missing today?
      placeholder: I'm frustrated when... / It would help if...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should this feature work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you considered.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the app does this affect?
      options:
        - Pantry
        - Recipe book
        - Meal planner
        - Shopping list
        - AI assistant (AiChef)
        - Settings
        - PWA / installation
        - Accessibility
        - Other

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, sketches, or other information.
