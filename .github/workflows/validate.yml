name: Validate

# Reusable workflow — called by ci.yml and deploy.yml to avoid duplication.
# Runs: install → lint → type-check (tsgo) → test:coverage → artifact (lcov) → build → bundle budget
#       → Playwright-Smoke (vite preview) → (optional) Pages artifact. (npm audit: check:all.)

on:
  workflow_call:
    inputs:
      upload-pages-artifact:
        description: 'Configure Pages and upload the dist/ artifact after build'
        type: boolean
        default: false
        required: false
      run-e2e-smoke:
        description: 'Run Playwright smoke against vite preview (slow browser download on cold runners)'
        type: boolean
        default: true
        required: false
    secrets:
      CODECOV_TOKEN:
        description: 'Token for uploading coverage to Codecov'
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check package version drift
        run: pnpm run check:version-drift

      - name: Check README version matches package.json
        run: pnpm run check:readme-version

      - name: Check README repo-truth (tests, thresholds)
        run: pnpm run check:repo-truth

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run type-check

      - name: Test with coverage
        run: pnpm run test:coverage

      - name: Test deploy verify scripts
        run: pnpm run test:scripts

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-lcov
          path: apps/web/coverage
          retention-days: 14

      # QNBS-v3: Upload lcov to Codecov for coverage analytics + PR annotations | non-blocking on outage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/web/coverage/lcov.info
          flags: web
          slug: qnbs/CulinaSync-de-
          fail_ci_if_error: false

      - name: Build
        run: pnpm run build

      - name: Check bundle budget
        run: pnpm run check:bundle-budget

      - name: Dependency audit (high+)
        run: pnpm audit --audit-level=high

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Rust advisory scan (Tauri lockfile)
        run: >
          cargo audit --file src-tauri/Cargo.lock
          --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195

      # QNBS-v3: CycloneDX-SBOM für Supply-Chain-Transparenz (Master Perfection P1)
      - name: Generate SBOM (CycloneDX)
        run: pnpm run generate:sbom

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 30

      # QNBS-v3: PR-CI überspringt E2E; Deploy nutzt Cache + chromium-only (ohne deprecated Action)
      - name: Cache Playwright browsers
        if: inputs.run-e2e-smoke
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium (retry)
        if: inputs.run-e2e-smoke
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Playwright install attempt ${attempt}/3"
            if pnpm exec playwright install chromium; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done
          exit 1

      - name: E2E smoke (Playwright + preview)
        if: inputs.run-e2e-smoke
        run: pnpm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report (on failure)
        if: inputs.run-e2e-smoke && failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

      - name: Verify GitHub Pages artifact
        if: inputs.upload-pages-artifact
        run: node scripts/verify-pages-artifact.mjs apps/web/dist

      - name: Setup Pages
        if: inputs.upload-pages-artifact
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        if: inputs.upload-pages-artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: './apps/web/dist'
