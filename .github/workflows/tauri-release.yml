# M8: Tauri 2 desktop builds (matrix) + config verify on every dispatch
name: Tauri release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check package version drift
        run: pnpm run check:version-drift

      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - name: Generate Tauri icons
        run: node scripts/generate-tauri-icons.mjs

      - name: Web build
        run: pnpm run build
        env:
          CULINASYNC_DESKTOP_BUILD: '1'

      - name: Cargo check (Tauri)
        working-directory: src-tauri
        run: cargo check

  build:
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install Apple Rust targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Tauri icons
        run: node scripts/generate-tauri-icons.mjs

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CULINASYNC_DESKTOP_BUILD: '1'
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'CulinaSync ${{ github.ref_name }}'
          releaseBody: |
            Desktop installers (Windows, macOS, Linux) for CulinaSync.
            See [docs/M8-TAURI-DESKTOP.md](https://github.com/qnbs/CulinaSync-de-/blob/main/docs/M8-TAURI-DESKTOP.md).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
